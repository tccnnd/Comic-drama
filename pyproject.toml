[project]
name = "comic-drama-workflow"
version = "0.5.0"
requires-python = ">=3.11"
description = "AI 漫画/视频生成流水线（script -> roles -> video provider -> timeline -> review）"
# 运行时依赖由 requirements.txt（pip-tools 锁定）管理，此处保持空以避免与 pip-tools 重复锁定。
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "_external|\\.venv|\\.tmp|workspace|outputs|data|node_modules"

[tool.isort]
profile = "black"
line_length = 100
extend_skip = ["_external", ".venv", ".tmp", "workspace", "outputs", "data", "node_modules"]

[tool.mypy]
python_version = "3.11"
# 渐进策略（T1.7）：仅对核心模块严格检查；其余模块暂忽略错误，后续逐步收紧。
files = [
    "backend/project_models.py",
    "backend/task_store.py",
    "video_providers.py",
]
follow_imports = "skip"
ignore_missing_imports = true
cache_dir = ".mypy_cache"
